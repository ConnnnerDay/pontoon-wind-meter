# Pontoon Wind Meter configuration
#
# Read once at startup, so restart the service after editing.
# Anything left out falls back to the default in config.py.

location:
  name:          "Wrightsville Beach / ICW"
  ndbc_station:  "41038"
  coops_station: "8658120"   # NOAA CO-OPS tide-gauge station (Wilmington, NC)
  lat:           34.2108
  lon:          -77.5986

thresholds:
  # Wind speed (mph) — controls gauge zone colours and GO / CAUTION / NO-GO verdict
  good_mph:    22      # below this  → GO   (green)
  caution_mph: 30      # 22–30 mph   → CAUTION (yellow); above → NO-GO (red)
  gauge_max:   40      # full-scale gauge value (must exceed caution_mph for a red zone)

  # Data freshness — readings older than this are shown as "STALE"
  stale_minutes: 90

  # Wave thresholds (feet and seconds). The good/caution heights set the wave
  # status dot directly. In the overall verdict waves count at 0.75 weight, so
  # with these defaults 3 ft reads CAUTION and it takes >5 ft for NO-GO
  # (about 3.7 ft in short-period chop).
  wave_good_ft:    2.0
  wave_caution_ft: 3.0
  wave_chop_dpd:   5.0   # dominant period < this = short choppy swell (penalised)
  wave_swell_dpd:  9.0   # dominant period ≥ this = long gentle swell (forgiven)

  # Water temperature (°F)
  temp_cool_f: 65    # water below this starts counting against you
  temp_cold_f: 50    # water at/below this → CAUTION; also the cold-air (feels-like) CAUTION line

  # Air temperature comfort (°F) — open pontoon deck
  atmp_warm_f:   80.0  # above this, up to 5 mph is taken off the gust (not above caution_mph)
  atmp_chilly_f: 62.0  # below this, a small cold-air nudge; feels-like below temp_cold_f → CAUTION

  # Fog risk: air-to-dewpoint spread (°F) below this reads as fog. A 5°F spread
  # is just a humid coastal day, so keep this tight or every muggy morning
  # turns CAUTION.
  fog_spread_f: 3.0

  # Falling pressure: a drop of this many hPa across the last few buoy
  # observations (up to 6) forces CAUTION
  pres_fall_caution: 1.5

polling:
  poll_interval:    300   # seconds between NDBC data refreshes (5 min)
  alerts_interval:  600   # seconds between Weather.gov alert refreshes (10 min)
  frame_rate:       30    # display frames per second
  web_port:         8080  # HTTP dashboard port

cache:
  # Every good buoy reading is saved here so the display can keep showing the
  # last known conditions through a network outage.
  enabled:          true
  path:             "/home/pizero/.cache/pontoon-meter/latest_snapshot.json"
  max_age_minutes:  180   # snapshots older than this are considered too stale to use
